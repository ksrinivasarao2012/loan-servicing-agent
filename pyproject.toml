[project]
name = "loan-servicing-agent"
version = "0.1.0"
description = "Text-only loan customer-service agent demo (fake data)"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=3.6.1",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loan_agent"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
